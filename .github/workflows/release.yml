name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            # universal-apple-darwin is a Tauri-only pseudo-target: rustup has no
            # rust-std for it, so the toolchain step installs both real triples.
            target: universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            label: macOS (Intel + Apple Silicon)
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            rust_targets: x86_64-pc-windows-msvc
            label: Windows x64
    runs-on: ${{ matrix.platform }}
    name: ${{ matrix.label }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target ${{ matrix.target }}
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || format('v__VERSION__-dev.{0}', github.run_number) }}
          releaseName: Lyric Timer v__VERSION__
          releaseBody: |
            Скачайте установщик для своей системы ниже.

            **macOS** — приложение не подписано, поэтому при первом запуске Gatekeeper ругается.
            Разово выполните в терминале:
            `xattr -cr "/Applications/Lyric Timer.app"`
            либо правый клик по приложению → «Открыть» → «Открыть».

            **Windows** — SmartScreen покажет предупреждение: «Подробнее» → «Выполнить в любом случае».
          releaseDraft: true
          prerelease: false
