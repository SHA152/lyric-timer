[package]
name = "lyric-timer"
version = "0.1.0"
description = "Per-word lyric timing tool"
authors = ["Alexey Lysenko"]
license = "MIT"
repository = "https://github.com/abesmon/lyric-timer"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "lyric_timer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
